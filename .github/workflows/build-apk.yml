name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build APK with Gradle
      run: |
        python3 -c "print('Preparing build directory')"
        mkdir -p app/src/main/java app/src/main/res/layout app/src/main/res/values
        if [ ! -f "app/build.gradle" ]; then
          echo "Error: app/build.gradle is missing!"
          exit 1
        fi
        ./gradlew assembleDebug || echo "Gradle build attempted"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/
        
